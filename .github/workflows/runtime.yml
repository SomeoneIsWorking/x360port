name: Runtime

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-runtime:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 JIT
            os: ubuntu-24.04
            llvm_arch: x64
            machine: x86_64
          - name: Windows x86-64 JIT
            os: windows-2025
            llvm_arch: x64
            machine: x86_64
          - name: macOS arm64 JIT
            os: macos-15
            llvm_arch: arm64
            machine: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out x360port
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read pinned dependency revisions
        id: pins
        shell: bash
        run: |
          python3 tools/dependency_pin.py --name xenia --field repository \
            | sed 's/^/repository=/' >> "$GITHUB_OUTPUT"
          python3 tools/dependency_pin.py --name xenia --field revision \
            | sed 's/^/revision=/' >> "$GITHUB_OUTPUT"

      - name: Check out pinned Xenia fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.pins.outputs.repository }}
          ref: ${{ steps.pins.outputs.revision }}
          path: build/deps/xenia
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes libfontconfig-dev libgtk-3-dev liblz4-dev libsdl2-dev libx11-xcb-dev

      # Xenia's shader build runs spirv-opt --canonicalize-ids, which the
      # distribution's SPIRV-Tools predates. The pinned SDK supplies
      # glslangValidator, spirv-opt and spirv-dis through VULKAN_SDK.
      - name: Install pinned Vulkan SDK shader tools
        if: runner.os == 'Linux'
        env:
          VULKAN_SDK_VERSION: 1.4.341.1
          VULKAN_SDK_SHA256: 3bf0f762afb6c79bc6a9d9fb5998745ccff928800a29619b501ed9de7fd9789b
        run: |
          archive="$RUNNER_TEMP/vulkansdk.tar.xz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz"
          echo "$VULKAN_SDK_SHA256  $archive" | sha256sum --check --strict
          tar --extract --xz --file "$archive" --directory "$RUNNER_TEMP" \
            "$VULKAN_SDK_VERSION/x86_64/bin/glslang" \
            "$VULKAN_SDK_VERSION/x86_64/bin/glslangValidator" \
            "$VULKAN_SDK_VERSION/x86_64/bin/spirv-opt" \
            "$VULKAN_SDK_VERSION/x86_64/bin/spirv-dis" \
            "$VULKAN_SDK_VERSION/x86_64/lib"
          echo "VULKAN_SDK=$RUNNER_TEMP/$VULKAN_SDK_VERSION/x86_64" >> "$GITHUB_ENV"

      - name: Install pinned LLVM
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: 20.1.8
          arch: ${{ matrix.llvm_arch }}
          env: true

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.10.12
          python-version: 3.12.13
          enable-cache: false

      - name: Verify real Xenia runtime
        run: >-
          uv run --frozen python tools/verify.py
          --xenia-source build/deps/xenia
          --build-dir build/ci
          --expected-machine ${{ matrix.machine }}
